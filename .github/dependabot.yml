version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      semver-major-days: 90
      include:
        - typescript
        - eslint
        - "@eslint/js"
        - typescript-eslint
        - "@types/node"
        - c8
    groups:
      eslint-toolchain:
        applies-to: version-updates
        patterns:
          - eslint
          - "@eslint/js"
          - typescript-eslint
        update-types:
          - minor
          - patch
      typescript-tooling:
        applies-to: version-updates
        patterns:
          - typescript
          - "@types/node"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      codeql:
        applies-to: version-updates
        patterns:
          - "github/codeql-action/*"
