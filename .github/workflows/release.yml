name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the selected current main commit
        shell: bash
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Enable pinned pnpm for cache discovery
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Enable pinned package managers
        run: |
          corepack enable
          npm install --global npm@11.5.2
      - name: Offline verification
        env:
          CHAPA_SECRET_KEY: ''
        run: |
          pnpm install --frozen-lockfile
          pnpm verify
          pnpm changeset:status
          node scripts/release-preflight.mjs release
      - name: Pack exact release
        shell: bash
        run: |
          release="$(node scripts/release-preflight.mjs release)"
          version="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).version)" "${release}")"
          mkdir -p .artifacts/release
          npm pack --pack-destination .artifacts/release
          node scripts/release-preflight.mjs integrity ".artifacts/release/sye1321-nestjs-chapa-${version}.tgz" > .artifacts/release/integrity.txt
          printf '%s' "${version}" > .artifacts/release/version.txt
          printf '%s' "${release}" > .artifacts/release/release.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: .artifacts/release
          if-no-files-found: error
          retention-days: 1

  sandbox:
    needs: verify
    runs-on: ubuntu-latest
    environment: chapa-test-mode
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable pinned pnpm for cache discovery
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Protected Chapa Test Mode smoke
        env:
          CHAPA_SECRET_KEY: ${{ secrets.CHAPA_SECRET_KEY }}
        run: pnpm smoke:sandbox

  publish:
    needs: sandbox
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      github-prerelease: ${{ steps.candidate.outputs.github-prerelease }}
      published-now: ${{ steps.publication.outputs.published-now }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global npm@11.5.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: .artifacts/release
      - name: Read candidate
        id: candidate
        shell: bash
        run: |
          release="$(cat .artifacts/release/release.json)"
          test "${release}" = "$(node scripts/release-preflight.mjs release)"
          version="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).version)" "${release}")"
          github_prerelease="$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).githubPrerelease))" "${release}")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "github-prerelease=${github_prerelease}" >> "${GITHUB_OUTPUT}"
      - name: Publish once or verify a matching existing version
        id: publication
        shell: bash
        run: |
          echo 'published-now=false' >> "${GITHUB_OUTPUT}"
          version="${{ steps.candidate.outputs.version }}"
          release="$(cat .artifacts/release/release.json)"
          npm_tag="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).npmTag)" "${release}")"
          protected_tag="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).channel === 'rc' ? 'latest' : 'rc')" "${release}")"
          tarball=".artifacts/release/sye1321-nestjs-chapa-${version}.tgz"
          expected="$(cat .artifacts/release/integrity.txt)"
          tags_before="$(npm view @sye1321/nestjs-chapa dist-tags --json)"
          protected_before="$(node -e "const t=JSON.parse(process.argv[1]); const v=t[process.argv[2]]; if(typeof v!=='string'||!v) process.exit(1); process.stdout.write(v)" "${tags_before}" "${protected_tag}")"
          lookup_error="$(mktemp)"
          if existing="$(npm view "@sye1321/nestjs-chapa@${version}" dist.integrity 2>"${lookup_error}")"; then
            test -n "${existing}"
          elif grep -Eq '^npm (error|ERR!) code E404|404 Not Found - GET https://registry\.npmjs\.org/' "${lookup_error}"; then
            existing=''
            echo 'Registry confirmed the exact version does not exist; publication may continue.'
          else
            echo 'npm registry lookup failed without a confirmed E404; refusing to publish.'
            exit 1
          fi
          rm -f "${lookup_error}"
          if [ -z "${existing}" ]; then
            npm publish "${tarball}" --access public --tag "${npm_tag}" --provenance
            echo 'published-now=true' >> "${GITHUB_OUTPUT}"

            # A successful publish can precede registry read visibility while npm
            # propagates and scans the new version. Retry only confirmed E404s.
            for attempt in {1..31}; do
              visibility_error="$(mktemp)"
              if metadata="$(npm view "@sye1321/nestjs-chapa@${version}" version dist.integrity --json 2>"${visibility_error}")"; then
                rm -f "${visibility_error}"
                break
              elif grep -Eq '^npm (error|ERR!) code E404|404 Not Found - GET https://registry\.npmjs\.org/' "${visibility_error}"; then
                rm -f "${visibility_error}"
                if [ "${attempt}" -eq 31 ]; then
                  echo 'Published version was still not visible after 31 attempts.'
                  exit 1
                fi
                echo "Published version is not visible yet; retrying in 30 seconds (${attempt}/31)."
                sleep 30
              else
                cat "${visibility_error}" >&2
                rm -f "${visibility_error}"
                echo 'Post-publish registry lookup failed with an unexpected error.'
                exit 1
              fi
            done

            node -e "const m=JSON.parse(process.argv[1]); if(m.version!==process.argv[2] || m['dist.integrity']!==process.argv[3]) process.exit(1)" "${metadata}" "${version}" "${expected}"
            existing="${expected}"
          fi
          test "${existing}" = "${expected}"
          test "$(npm view "@sye1321/nestjs-chapa@${version}" version)" = "${version}"
          test "$(npm view "@sye1321/nestjs-chapa" "dist-tags.${npm_tag}")" = "${version}"
          test "$(npm view "@sye1321/nestjs-chapa" "dist-tags.${protected_tag}")" = "${protected_before}"

  release-source:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source-sha: ${{ steps.anchor.outputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Establish or verify immutable release source tag
        id: anchor
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          PUBLISHED_NOW: ${{ needs.publish.outputs.published-now }}
        shell: bash
        run: |
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            source_sha="$(git rev-list -n 1 "refs/tags/${tag}")"
            if [ "${PUBLISHED_NOW}" = true ]; then
              test "${source_sha}" = "${GITHUB_SHA}"
            fi
          elif [ "${PUBLISHED_NOW}" = true ]; then
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
            source_sha="${GITHUB_SHA}"
          else
            echo 'The immutable npm version has no release source tag; manual provenance/source audit is required.'
            exit 1
          fi
          test -n "${source_sha}"
          echo "source-sha=${source_sha}" >> "${GITHUB_OUTPUT}"

  consumers:
    needs: [publish, release-source]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable pinned pnpm for cache discovery
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify registry-installed consumers
        env:
          CHAPA_SECRET_KEY: ''
        run: node scripts/test-consumers.mjs --package-spec "@sye1321/nestjs-chapa@${{ needs.publish.outputs.version }}"

  github-release:
    needs: [publish, release-source, consumers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          GITHUB_PRERELEASE: ${{ needs.publish.outputs.github-prerelease }}
          SOURCE_SHA: ${{ needs.release-source.outputs.source-sha }}
        shell: bash
        run: |
          tag="v${VERSION}"
          test "$(git rev-list -n 1 "refs/tags/${tag}")" = "${SOURCE_SHA}"
          if gh release view "${tag}" --json isPrerelease,tagName >/tmp/release.json 2>/dev/null; then
            node -e "const r=require('/tmp/release.json'); if(String(r.isPrerelease)!==process.env.GITHUB_PRERELEASE || r.tagName!=='v'+process.env.VERSION) process.exit(1)"
          elif [ "${GITHUB_PRERELEASE}" = true ]; then
            gh release create "${tag}" --verify-tag --prerelease --title "${tag}" --generate-notes
          else
            gh release create "${tag}" --verify-tag --title "${tag}" --generate-notes
          fi
