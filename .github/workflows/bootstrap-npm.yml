name: One-time npm namespace bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: npm-bootstrap
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Require the current main commit
        shell: bash
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Enable pinned package managers
        run: |
          corepack enable
          npm install --global npm@11.5.2
      - name: Verify namespace is eligible
        shell: bash
        run: |
          test "$(node -p "require('./package.json').name")" = '@sye1321/nestjs-chapa'
          if npm view @sye1321/nestjs-chapa name >/dev/null 2>&1; then
            echo 'Package already exists; bootstrap is permanently disabled.'
            exit 1
          fi
      - name: Provider-offline quality gates
        env:
          CHAPA_SECRET_KEY: ''
        run: |
          pnpm install --frozen-lockfile
          pnpm verify
          pnpm changeset:status
      - name: Create ephemeral bootstrap tarball
        shell: bash
        run: |
          version="$(node scripts/release-preflight.mjs bootstrap-version)"
          npm version "${version}" --no-git-tag-version --allow-same-version
          mkdir -p .artifacts/bootstrap
          npm pack --pack-destination .artifacts/bootstrap
          echo "BOOTSTRAP_VERSION=${version}" >> "${GITHUB_ENV}"
      - name: Publish bootstrap artifact with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: npm publish ".artifacts/bootstrap/sye1321-nestjs-chapa-${BOOTSTRAP_VERSION}.tgz" --access public --tag bootstrap --provenance
      - name: Verify bootstrap publication and tags
        shell: bash
        run: |
          test "$(npm view "@sye1321/nestjs-chapa@${BOOTSTRAP_VERSION}" version)" = "${BOOTSTRAP_VERSION}"
          test -n "$(npm view "@sye1321/nestjs-chapa@${BOOTSTRAP_VERSION}" dist.attestations.provenance.url)"
          tags="$(npm view @sye1321/nestjs-chapa dist-tags --json)"
          test "$(node -e "const t=JSON.parse(process.argv[1]); process.stdout.write(t.bootstrap ?? '')" "${tags}")" = "${BOOTSTRAP_VERSION}"
          test "$(node -e "const t=JSON.parse(process.argv[1]); process.stdout.write(t.latest ?? '')" "${tags}")" != "${BOOTSTRAP_VERSION}"
